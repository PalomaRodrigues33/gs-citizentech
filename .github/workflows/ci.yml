name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Sem o arquivo do SP156 no CI, os testes da API aparecem como SKIPPED
      - run: python -m pytest -v -rs

  web:
    name: App React (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker (build, testes e saúde da API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t citizentech:ci .
      - name: Imagem gerada
        run: docker images citizentech
      - name: Testes dentro do contêiner
        run: docker run --rm citizentech:ci python -m pytest -v -rs
      - name: Subir a API e conferir /api/saude
        run: |
          docker run -d --name citizentech -p 8000:8000 citizentech:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/saude; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/api/saude
          echo
          curl -fsSI http://localhost:8000/api/saude | grep -iE "content-security-policy|x-frame-options|x-content-type-options"
          docker ps --filter name=citizentech
      - name: Logs do contêiner
        if: always()
        run: docker logs citizentech || true
      - name: Parar o contêiner
        if: always()
        run: docker rm -f citizentech || true
